[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-designer"
version = "0.6.2"
description = "The Brain of the Matrix ecosystem — turns an idea + chosen blueprint into a governed Design Bundle with every batch, via an agentic LLM crew. The 'batches guy'."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ruslan Magana Vsevolodovna", email = "contact@ruslanmv.com" }]
requires-python = ">=3.10"
keywords = ["matrix-builder", "ai-agents", "design", "mcp", "crewai", "governance"]
dependencies = [
  "jsonschema>=4.20",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
agentic = ["crewai>=0.40"]          # the default agentic backend
langgraph = ["langgraph>=0.2"]      # alternative backend
mcp = ["mcp>=1.2"]                   # matrix-designer-mcp server runtime
service = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2"]  # HTTP service
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
mdesign = "matrix_designer.cli:main"
matrix-designer-service = "matrix_designer.service:main"

[project.urls]
Homepage = "https://ruslanmv.com"
Ecosystem = "https://github.com/agent-matrix/matrix-builder"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Default-ish rule set (pyflakes + a slice of pycodestyle). E701/E702 are intentionally
# allowed: the codebase uses compact one-liners by design.
select = ["E4", "E7", "E9", "F", "W"]
ignore = ["E701", "E702", "E741"]

[tool.setuptools.packages.find]
where = ["src"]

# Ship the schema + design-packs inside the wheel so `pip install matrix-designer`
# works (validate/load_pack need them). Without this they would be excluded.
[tool.setuptools.package-data]
matrix_designer = [
  "_data/schemas/*.json",
  "_data/packs/*/*.yaml",
  "_data/packs/*/*.json",
]
